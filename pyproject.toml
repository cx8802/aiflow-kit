[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiflow-kit"
version = "0.1.0"
description = "Lightweight AI coding workflow CLI, templates, and skills."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
sqlserver = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
mongodb = ["pymongo>=4.6"]
db = [
    "PyMySQL>=1.1",
    "psycopg[binary]>=3.1",
    "pyodbc>=5.0",
    "oracledb>=2.0",
    "pymongo>=4.6",
]

[project.scripts]
aiflow = "aiflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiflow = ["assets/templates/*", "assets/skills/*/SKILL.md"]
