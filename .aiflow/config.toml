[project]
name = ""
type = "auto"

[commands]
install = ""
lint = ""
typecheck = ""
test = ""
build = ""
dev = ""

[context]
include = [
  "README.md",
  "package.json",
  "packages",
  "go.mod",
  "pom.xml",
  "docs",
  "scripts"
]
exclude = [
  ".git",
  ".cache",
  ".tools",
  ".venv",
  "node_modules",
  "dist",
  "build",
  ".next"
]

[memory]
enabled = true
project_file = ".aiflow/memory.md"
compact_file = ".aiflow/context.compact.md"
max_compact_entries = 30

[claude_agent]
enabled = true
runtime = "node"
default_model = "small"
small_model = "MiniMax-M2.7"
standard_model = "MiniMax-M2.7"
strong_model = "MiniMax-M2.7"
api_key_env = "ANTHROPIC_AUTH_TOKEN"
base_url_env = "ANTHROPIC_BASE_URL"
auth_token_env = "ANTHROPIC_AUTH_TOKEN"
proxy_mode = "direct"
overseas_proxy = "http://127.0.0.1:10808"
china_direct = true
permission_mode = "dontAsk"
allowed_tools = ["Read", "Glob", "Grep"]
disallowed_tools = ["Bash", "Edit", "Write"]
max_turns = 8
max_budget_usd = 1.0
timeout_seconds = 300
context_level = "compact"
max_context_file_chars = 12000
max_diff_chars = 40000
include_memory_context = false
runs_dir = ".aiflow/claude-agent/runs"
sessions_dir = ".aiflow/claude-agent/sessions"
usage_file = ".aiflow/claude-agent/usage.jsonl"

[frontend]
enabled = false
dev_url = "http://localhost:3000"
desktop_viewport = "1440x900"
mobile_viewport = "390x844"

[browser]
enabled = false
host = "127.0.0.1"
port = 8765
capture_dir = ".aiflow/browser/captures"
elements_dir = ".aiflow/browser/elements"
pages_dir = ".aiflow/browser/pages"
requests_dir = ".aiflow/browser/requests"
actions_dir = ".aiflow/browser/actions"
token_file = ".aiflow/browser/token"
max_payload_bytes = 1000000

[review]
require_tests = true
require_verification_summary = true
high_risk_paths = [
  "auth/",
  "security/",
  "payment/",
  "database/",
  "migrations/"
]

[skills]
install_to_codex_repo = true
install_to_codex_user = false
install_to_claude_user = false
install_to_claude_plugin = true
allow_global_install = false
